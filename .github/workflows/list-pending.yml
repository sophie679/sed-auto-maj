name: List Shop-e-Dom articles not yet Elementor

on:
  workflow_dispatch: {}   # déclenchement manuel uniquement (pas de cron)

jobs:
  list-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List pending articles
        env:
          WP_SHOP_URL: ${{ secrets.WP_SHOP_URL }}
          WP_SHOP_USER: ${{ secrets.WP_SHOP_USER }}
          WP_SHOP_APP_PASSWORD: ${{ secrets.WP_SHOP_APP_PASSWORD }}
        run: python src/list_pending.py
